# Verteilt SUITE.md als Read-only-Kopie in alle Modul-Repos des NRG-Stack.
# Voraussetzung: Actions-Secret SUITE_SYNC_TOKEN in DIESEM Repo (NRGEMS) —
# Fine-grained PAT von DG65 mit "Contents: Read and write" für die Ziel-Repos.
# Zielbranch je Repo: derselbe Branch wie der Quell-Push (ems-integration/main),
# falls er dort existiert — sonst der Default-Branch des Ziel-Repos.
name: SUITE.md-Sync

on:
  push:
    branches: [ems-integration, main]
    paths: [SUITE.md]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo:
          - NRGChargerHub
          - NRGCometWiFi
          - NRGInverterHub
          - NRGMeterHub
          - NRGMigrationsHub
          - NRGModbusSlave
          - NRGDashboard
          - NRGPrognose
          - NRGSteuerboxHub
          - NRGStrukturHub
          - NRGStromGedachtWidget
          - NRGSzenariorechner
          - NRGTibberGridRewards
          - NRGWPHub
          - NRGHeishaMon
          - NRGTessie
          - NRGGleitenderMittelwert
    steps:
      - uses: actions/checkout@v4

      - name: SUITE.md in Ziel-Repo pushen
        env:
          GH_TOKEN: ${{ secrets.SUITE_SYNC_TOKEN }}
        run: |
          set -e
          SRC_BRANCH="${GITHUB_REF_NAME:-ems-integration}"
          git clone --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/DG65/${{ matrix.repo }}.git" target
          cd target
          if git ls-remote --exit-code --heads origin "$SRC_BRANCH" > /dev/null 2>&1; then
            git fetch --depth 1 origin "$SRC_BRANCH:refs/remotes/origin/$SRC_BRANCH"
            git checkout -B "$SRC_BRANCH" "refs/remotes/origin/$SRC_BRANCH"
          else
            echo "Branch $SRC_BRANCH existiert in ${{ matrix.repo }} nicht — nutze Default-Branch."
          fi
          {
            echo "<!-- AUTO-SYNC aus DG65/NRGEMS (Branch $SRC_BRANCH) — NICHT HIER EDITIEREN."
            echo "     Aenderungen gehoeren in NRGEMS/SUITE.md; diese Kopie wird bei jedem"
            echo "     Quell-Push ueberschrieben (NRGEMS/.github/workflows/sync-suite.yml). -->"
            cat ../SUITE.md
          } > SUITE.md
          if git status --porcelain -- SUITE.md | grep -q .; then
            git config user.name  "suite-sync[bot]"
            git config user.email "suite-sync@users.noreply.github.com"
            git add SUITE.md
            git commit -m "SUITE.md-Sync aus NRGEMS ($SRC_BRANCH)"
            git push origin "HEAD:$(git rev-parse --abbrev-ref HEAD)"
          else
            echo "SUITE.md unveraendert — nichts zu tun."
          fi
